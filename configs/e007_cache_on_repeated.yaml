experiment_id: E007
model: Qwen/Qwen2.5-7B-Instruct
base_url: http://localhost:18000
num_requests: 30
warmup_requests: 3
concurrency: 1
seed: 42
temperature: 0.0
request_timeout_seconds: 300.0
enable_prefix_caching: true
enable_chunked_prefill: false
telemetry_interval_seconds: 0.1
device_index: 0
output_dir: runs
workload:
  name: shared_prefix_cache_on
  input_tokens:
    values: [4096]
    weights: [1.0]
  max_output_tokens:
    values: [64]
    weights: [1.0]
  prompt_reuse:
    mode: shared_prefix
    shared_prefix_tokens: 3072
    reuse_group_id: e007-shared-prefix
    cache_block_size_tokens: 16
