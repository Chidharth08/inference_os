# E001-A Experiment Configuration: Input Length Scaling
# Evaluates prefill scaling (TTFT), KV cache growth, and E2E latency
# across input token lengths holding output tokens and concurrency constant.

experiment_id: E001A
sweep_param: prompt_tokens
sweep_values:
  - 128
  - 512
  - 2048
  - 4096

model: Qwen/Qwen2.5-7B-Instruct
base_url: http://localhost:18000
max_output_tokens: 128
num_requests: 10
warmup_requests: 2
seed: 42
temperature: 0.0
enable_prefix_caching: false
telemetry_interval_seconds: 0.1
device_index: 0
output_dir: runs
