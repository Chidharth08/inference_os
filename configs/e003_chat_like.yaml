# Synthetic token-shape profile; not a production chat traffic claim.
experiment_id: E003
model: Qwen/Qwen2.5-7B-Instruct
base_url: http://localhost:18000
num_requests: 50
warmup_requests: 5
concurrency: 4
seed: 42
temperature: 0.0
enable_prefix_caching: false
enable_chunked_prefill: false
telemetry_interval_seconds: 0.1
device_index: 0
output_dir: runs
workload:
  name: chat_like
  input_tokens:
    values: [128, 256, 512, 1024]
    weights: [0.25, 0.40, 0.25, 0.10]
  max_output_tokens:
    values: [32, 64, 128, 256]
    weights: [0.25, 0.40, 0.25, 0.10]
  prompt_reuse:
    mode: none
