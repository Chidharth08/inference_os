# E002 Pilot Experiment Configuration: Concurrency Smoke Test
# Evaluates closed-loop concurrency scaling across [1, 4, 8]
# with 15 requests per point to verify server connectivity,
# telemetry, error-free streaming, and persistence before full run.

experiment_id: E002_PILOT
sweep_param: concurrency
sweep_values:
  - 1
  - 4
  - 8

model: Qwen/Qwen2.5-7B-Instruct
base_url: http://localhost:18000
prompt_tokens: 512
max_output_tokens: 128
num_requests: 15
warmup_requests: 2
seed: 42
temperature: 0.0
enable_prefix_caching: false
enable_chunked_prefill: false
telemetry_interval_seconds: 0.1
device_index: 0
output_dir: runs
