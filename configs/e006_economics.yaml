experiment_id: E006
source_summary: runs/E005_20260927_063839_565f514e/e005_summary.json
output_dir: outputs/e006_serving_economics

# This is an explicit user-supplied Vast.ai estimate, not a universal RTX 3090
# market price. Change it to reproduce the analysis under another price.
assumptions:
  currency: USD
  gpu_price_per_hour: 0.190
  gpu_count: 1
  billing_increment_seconds: 1.0
  idle_time_included: true
  actual_session_cost: 0.50
  actual_session_cost_is_approximate: true

measurement_scope: >-
  Per-point measured wall time, including arrival gaps and backlog drain;
  excluding warm-up, instance setup, model download/loading, time between load
  points, result packaging, and other session overhead.
