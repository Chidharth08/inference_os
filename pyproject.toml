[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-os"
version = "0.1.0"
description = "A reproducible framework for designing, running, measuring, and analyzing LLM inference experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "transformers>=4.40.0",
]

[project.scripts]
inference-os = "inference_os.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
